syntax = "proto3";

package example.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/mattdowdell/sandbox/gen/example/v1;examplev1";

// ...
message Resource {
  option (buf.validate.message).cel = {
    id: "updated_at_before_created_at"
    message: "updated_at cannot be less than created_at"
    expression: "this.updated_at >= this.created_at"
  };

  // The generated ID for the resource.
  string id = 1 [(buf.validate.field).string.uuid = true];

  // The user-defined name of the resource.
  string name = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 100
    pattern: "^[ -~]+$" // printable ascii
  }];

  // When the resource was created.
  google.protobuf.Timestamp created_at = 3 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800} /* 0001-01-01T00:00:00Z */
    lte: {seconds: 253402300799} /* 9999-12-31T23:59:59Z */
  }];

  // When the resource was last updated.
  google.protobuf.Timestamp updated_at = 4 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800} /* 0001-01-01T00:00:00Z */
    lte: {seconds: 253402300799} /* 9999-12-31T23:59:59Z */
  }];
}

// ...
message ResourceCreate {
  // The name for the new resource.
  string name = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 100
    pattern: "^[ -~]+$" // printable ascii
  }];
}

// ...
message ResourceUpdate {
  // The ID of the resource.
  string id = 1 [(buf.validate.field).string.uuid = true];

  // The new name for the resource.
  string name = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 100
    pattern: "^[ -~]+$" // printable ascii
  }];
}

enum Operation {
  // ...
  OPERATION_UNSPECIFIED = 0;

  // ...
  OPERATION_CREATED = 1;

  // ...
  OPERATION_MODIFIED = 2;

  // ...
  OPERATION_DELETED = 3;
}

// ...
message AuditEvent {
  // The generated ID of the audit event.
  string id = 1 [(buf.validate.field).string.uuid = true];

  // ...
  Operation operation = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // ...
  google.protobuf.Timestamp created_at = 3 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800} /* 0001-01-01T00:00:00Z */
    lte: {seconds: 253402300799} /* 9999-12-31T23:59:59Z */
  }];

  // ...
  string summary = 4; // TODO: min/max length

  // ...
  string resource_id = 5 [(buf.validate.field).string.uuid = true];

  // ...
  string resource_type = 6; // TODO: min/max length
}
