syntax = "proto3";

package authn.v1;

import "authn/v1/messages.proto";

option go_package = "github.com/mattdowdell/sandbox/gen/authn/v1;authnv1";

// AuthnService is a simple RPC service for use in authentication management.
//
// Implementations should respond with one of the following status codes in an error scenario:
//
// - INVALID_ARGUMENT if the request did not pass validation.
// - UNAUTHENTICATED if the request did not contain valid authentication.
// - INTERNAL for any other errors.
//
// Furthermore, clients should also expect any of the status codes that may be returned by RPC
// libraries.
service AuthnService {
  // Login is used to generate a token to use as authentication in subsequent requests. This method
  // should be used by external API clients.
  rpc Login(LoginRequest) returns (LoginResponse) {}

  // Authenticate is used to validate tokens generated by Login. This method should be used
  // internally for all authenticated endpoints.
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse) {}
}
