---
# https://trivy.dev/latest/docs/references/configuration/config-file/

# https://github.com/aquasecurity/trivy/discussions/7538
db:
  repository: public.ecr.aws/aquasecurity/trivy-db:2

exit-code: 0
ignorefile: .trivyignore.yaml
ignore-policy: config/trivyignore.rego

scan:
  scanners:
    - vuln
    - secret
    - license
    - misconfig
  skip-dirs:
    - vendor

severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL
