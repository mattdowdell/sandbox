---
# https://vektra.github.io/mockery/latest/configuration/

include-auto-generated: true
template: "testify"
template-data:
  unroll-variadic: true

packages:
  # internal dependencies
  github.com/mattdowdell/sandbox/gen/authn/v1/authnv1connect:
    config:
      dir: "gen/authn/v1/authnv1connect/mockauthnv1connect"
      filename: "mocks.go"
      pkgname: "mockauthnv1connect"
    interfaces:
      AuthnServiceClient: {}
  github.com/mattdowdell/sandbox/internal/adapters/authnrpc:
    config:
      all: true
  github.com/mattdowdell/sandbox/internal/adapters/configrpc:
    config:
      all: true
  github.com/mattdowdell/sandbox/internal/adapters/examplerpc:
    config:
      all: true
  github.com/mattdowdell/sandbox/internal/adapters/txn:
    config:
      all: true
      dir: "internal/adapters/txn/mocktxn"
      filename: "mocks.go"
      pkgname: "mocktxn"
  github.com/mattdowdell/sandbox/internal/adapters/usecasefacades:
    config:
      all: true
  github.com/mattdowdell/sandbox/internal/domain/repositories:
    config:
      all: true
      dir: "internal/domain/repositories/mockrepositories"
      filename: "mocks.go"
      pkgname: "mockrepositories"
  github.com/mattdowdell/sandbox/internal/drivers/rpcserver:
    config:
      exclude-interface-regex: "^RecovererOption$"
      include-interface-regex: "^.+$"
  github.com/mattdowdell/sandbox/pkg/slogt:
    config:
      all: true
  # external dependencies
  connectrpc.com/connect:
    config:
      dir: "internal/drivers/rpcserver/mockconnect"
      filename: "mocks.go"
      pkgname: "mockconnect"
    interfaces:
      AnyRequest: {}
      StreamingHandlerConn: {}
  github.com/golang-jwt/jwt/v5:
    config:
      dir: "internal/adapters/authnrpc"
      filename: "jwt_mocks_test.go"
      pkgname: "authnrpc"
    interfaces:
      Claims: {}
