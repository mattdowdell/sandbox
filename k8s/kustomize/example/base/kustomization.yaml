---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
  - job.yaml
  - pod-disruption-budget.yaml
  - service.yaml
  - service-account.yaml
configurations:
  - kustomizeconfig.yaml

namespace: default

labels:
  - pairs:
      app: example
      app.kubernetes.io/name: example
