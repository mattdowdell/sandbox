---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

configMapGenerator:
  - name: grafana-dashboards
    options:
      disableNameSuffixHash: true
    files:
      - connectrpc.json=dashboards/connectrpc.json
      - database.json=dashboards/database.json
      - go_runtime.json=dashboards/go_runtime.json
      - grpc.json=dashboards/grpc.json
