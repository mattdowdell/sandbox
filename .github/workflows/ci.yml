---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  size:
    name: Size
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Size
        id: size
        uses: mattdowdell/pr-sizer@e523aba6b9ee5306cd9c69cb08fd59a893e399ca # v0.3.0

      - name: Outputs
        run: |
          echo size=${SIZE}
          echo includes=${INCLUDES}
          echo excludes=${EXCLUDES}
          echo ignores=${IGNORES}
        env:
          SIZE: ${{ steps.size.outputs.size }}
          INCLUDES: ${{ steps.size.outputs.includes }}
          EXCLUDES: ${{ steps.size.outputs.excludes }}
          IGNORES: ${{ steps.size.outputs.ignores }}

  checks:
    name: Checks
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup checks
        uses: ./.github/actions/setup-checks

      - name: Start database
        uses: hoverkraft-tech/compose-action@40041ff1b97dbf152cd2361138c2b03fa29139df # v2.3.0
        with:
          compose-file: compose.yaml
          up-flags: --build --wait
          down-flags: --volumes --remove-orphans
          services: |
            postgres
            migrate

      - name: Seed
        run: |
          just db-seed

      - name: Checks
        run: |
          just checks dirty

  lint:
    name: Lint
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    needs:
      - checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Get version
        id: version
        run: |
          ./tools/bingo-version.sh golangci-lint >> $GITHUB_OUTPUT

      - name: Lint Go
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.version.outputs.version }}
          args: --timeout=10m

      - name: Lint Protobuf
        uses: bufbuild/buf-action@8f4a1456a0ab6a1eb80ba68e53832e6fcfacc16c # v1.3.0
        with:
          pr_comment: false
          format: false
          breaking: false

  unit:
    name: Unit test
    if: |
      always() &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    needs:
      - checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Install Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0

      - name: Unit test
        run: just unit

    # TODO: report coverage to PR
    # maybe gwatts/go-coverage-action?

  scan:
    name: Scan
    if: |
      always() &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    needs:
      - checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Install Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0

      # required for trivy to find licenses
      # see https://trivy.dev/latest/docs/coverage/language/golang/#license
      - name: Populate Go mod cache
        run: just tidy-go

      - name: Get trivy version
        id: trivy-version
        run: |
          ./tools/docker-base-tag.sh Dockerfile.dev ghcr.io/aquasecurity/trivy >> $GITHUB_OUTPUT

      - name: Run trivy
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # 0.32.0
        with:
          scan-type: fs
          trivy-config: trivy.yaml
          version: v${{ steps.trivy-version.outputs.tag }}

      # TODO: publish to github for default branch builds?
      # https://github.com/actions/starter-workflows/blob/main/code-scanning/trivy.yml

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5ca5fc7a4779c5263a3ffa0e1f693009994446d1 # v0.1.2
        with:
          persona: pedantic

      - name: Run gitleaks
        uses: ./.github/actions/gitleaks

  functional:
    name: Functional Tests
    if: |
      always() &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      needs.unit.result == 'success' &&
      needs.scan.result == 'success'
    needs:
      - lint
      - unit
      - scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0

      - name: Setup coverage
        uses: gacts/run-and-post-run@d803f6920adc9a47eeac4cb6c93dbc2e2890c684 # v1.4.2
        with:
          run: |
            # hack to let container's user create coverage files
            sudo chown 65532:65532 .covdata

            # enable coverage builds
            echo GO_BUILD_ARGS=-cover > .env
          post: |
            # TODO: publish this somewhere
            go tool covdata percent -i=.covdata

            go tool covdata textfmt -i=.covdata -o cover.out
            go run ./tools/filter-coverage/ -output=functional.out cover.out
            echo "Total coverage: `go tool cover -func=functional.out | tail -n 1 | awk '{print $3}'`"

      - name: Start
        uses: hoverkraft-tech/compose-action@40041ff1b97dbf152cd2361138c2b03fa29139df # v2.3.0
        with:
          compose-file: compose.yaml
          up-flags: --build --wait
          down-flags: --volumes --remove-orphans

      - name: Functional test
        run: just functional

      - name: Collect logs
        if: always()
        run: |
          echo "::group::rpc logs"
          docker compose logs rpc
          echo "::endgroup::"

          echo "::group::migrate logs"
          docker compose logs migrate
          echo "::endgroup::"

          echo "::group::postgres logs"
          docker compose logs postgres
          echo "::endgroup::"

  tag:
    name: Tag
    if: |
      always() &&
      needs.functional.result == 'success'
    needs:
      - functional
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.tag.outputs.short }}
      long: ${{ steps.tag.outputs.long }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Tag
        id: tag
        uses: ./.github/actions/tag
        with:
          rollover: true

  build:
    name: Build
    if: |
      always() &&
      needs.tag.result == 'success'
    needs:
      - tag
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
      packages: write # for container push
      id-token: write # for keyless image signing
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: GHCR Login
        if: github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Setup cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Build
        uses: ./.github/actions/container-build
        with:
          service: example-rpc
          repository: ghcr.io/mattdowdell/sandbox/example-rpc
          version: ${{ needs.tag.outputs.long }}
          push: ${{ github.ref_name == github.event.repository.default_branch }}
