---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  size:
    name: Size
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
      pull-requests: write # for adding labels to PRs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Size
        id: size
        uses: mattdowdell/pr-sizer@ee8ce3fa199d4fb213b010253e362216d26463c4 # v0.5.2

      - name: Outputs
        run: |
          echo "size=${SIZE}"
          echo "includes=${INCLUDES}"
          echo "excludes=${EXCLUDES}"
          echo "ignores=${IGNORES}"
        env:
          SIZE: ${{ steps.size.outputs.size }}
          INCLUDES: ${{ steps.size.outputs.includes }}
          EXCLUDES: ${{ steps.size.outputs.excludes }}
          IGNORES: ${{ steps.size.outputs.ignores }}

  checks:
    name: Checks
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup checks
        uses: ./.github/actions/setup-checks

      - name: Start database
        uses: hoverkraft-tech/compose-action@4894d2492015c1774ee5a13a95b1072093087ec3 # v2.5.0
        with:
          compose-file: compose.yaml
          up-flags: --build --wait
          down-flags: --volumes --remove-orphans
          services: |
            postgres
            migrate

      - name: Seed
        run: |
          just db-seed

      - name: Checks
        run: |
          just checks dirty

  lint-go:
    name: Lint Go
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Get golangci-lint version
        id: version
        run: |
          ./tools/bingo-version.sh golangci-lint >> "$GITHUB_OUTPUT"

      - name: Lint Go
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: ${{ steps.version.outputs.version }}
          args: --timeout=10m

  lint-proto:
    name: Lint Proto
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint Protobuf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          pr_comment: false
          format: false
          breaking: false

  lint-actions:
    name: Lint Actions
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint Actions
        uses: reviewdog/action-actionlint@0d952c597ef8459f634d7145b0b044a9699e5e43 # v1.71.0
        with:
          fail_level: any

  link-k8s:
    name: Lint K8S
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Install bingo
        uses: mattdowdell/go-installer@de5d072ade9fc895652cd6a93ac4bde11e105bc6 # v0.4.0
        with:
          package: github.com/bwplotka/bingo

      - name: Lint K8S
        run: |
          just lint-k8s

  unit:
    name: Unit test
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Unit test
        run: just unit

    # TODO: report coverage to PR
    # maybe gwatts/go-coverage-action?

  scan-trivy:
    name: Scan Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
      security-events: write # for uploading code scanning results
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"

      # required for trivy to find licenses
      # see https://trivy.dev/latest/docs/coverage/language/golang/#license
      - name: Populate Go mod cache
        run: go mod tidy

      - name: Get trivy version
        id: trivy-version
        run: |
          ./tools/bingo-version.sh trivy >> "$GITHUB_OUTPUT"

      - name: Run trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-results.sarif
          version: ${{ steps.trivy-version.outputs.version }}

      # TODO: always run
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: trivy-results.sarif

  scan-zizmor:
    name: Scan Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
      security-events: write # for uploading code scanning results
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2
        with:
          persona: pedantic

  scan-gitleaks:
    name: Scan Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
      security-events: write # for uploading code scanning results
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run gitleaks
        uses: ./.github/actions/gitleaks

      # TODO: always run
      - name: Upload Gitleaks scan results
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: gitleaks.sarif

  functional-compose:
    name: Functional Tests (Compose)
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Enable coverage
        run: |
          # hack to let container's user create coverage files
          sudo chown 65532:65532 .covdata

          # enable coverage builds
          echo "GO_BUILD_ARGS=-cover -covermode=atomic" > .env

      - name: Start
        uses: hoverkraft-tech/compose-action@4894d2492015c1774ee5a13a95b1072093087ec3 # v2.5.0
        with:
          compose-file: compose.yaml
          up-flags: --build --wait
          down-flags: --volumes --remove-orphans

      - name: Functional test
        run: just functional

      - name: Collect coverage
        run: |
          curl -X POST http://localhost:5000/coverage -v

          # TODO: publish this somewhere
          go tool covdata percent -i=.covdata
          go tool covdata textfmt -i=.covdata -o cover.out

          go run ./tools/filter-coverage/ -output=functional.out cover.out
          echo "Total coverage: $(go tool cover -func=functional.out | tail -n 1 | awk '{print $3}')"

      - name: Collect logs
        if: always()
        run: |
          echo "::group::rpc logs"
          docker compose logs rpc
          echo "::endgroup::"

          echo "::group::migrate logs"
          docker compose logs migrate
          echo "::endgroup::"

          echo "::group::postgres logs"
          docker compose logs postgres
          echo "::endgroup::"

  functional-tilt:
    name: Functional Tests (Tilt)
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Install bingo
        uses: mattdowdell/go-installer@de5d072ade9fc895652cd6a93ac4bde11e105bc6 # v0.4.0
        with:
          package: github.com/bwplotka/bingo

      - name: Install Kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          mkdir -p "$HOME/.local/bin/"
          install -m 0755 kubectl "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Tilt
        run: |
          gh release download --repo tilt-dev/tilt v0.37.0 --pattern '*.linux.x86_64.tar.gz'
          tar -xvzf ./*.linux.x86_64.tar.gz tilt
          mkdir -p "$HOME/.local/bin/"
          install -m 0755 tilt "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup
        run: |
          just _kind-up
          tilt ci
        env:
          # enable coverage builds
          GO_BUILD_ARGS: "-cover -covermode=atomic"

      - name: Pre-test check
        run: |
          kubectl get deployments
          kubectl get pods

      - name: Port-forward
        run: |
          kubectl port-forward svc/example-rpc 5000:5000 &

      - name: Test
        run: just functional

      - name: Collect coverage
        run: |
          pods=$(kubectl get po -lapp=example -ojsonpath='{.items[*].metadata.name}')

          for i in "${!pods[@]}"; do
            kubectl port-forward "pod/${pods[i]}" "600$i:5000" &
            sleep 3
            curl -X POST "http://localhost:600$i/coverage" -v
            kubectl cp ./.covdata/ "${pods[i]}:/covdata/*"
            kill %1
          done

          ls -alph ./.covdata/

          go tool covdata percent -i=.covdata
          go tool covdata textfmt -i=.covdata -o cover.out

          go run ./tools/filter-coverage/ -output=functional.out cover.out
          echo "Total coverage: $(go tool cover -func=functional.out | tail -n 1 | awk '{print $3}')"

      - name: Collect logs
        if: always()
        run: |
          for name in $(kubectl get po -lapp=example -ojsonpath='{.items[*].metadata.name}'); do
            echo "::group::kubectl logs $name"
            kubectl logs $name
            echo "::endgroup::"
          done

          echo "::group::kubectl logs example-db-migrate"
          kubectl logs -lbatch.kubernetes.io/job-name=example-db-migrate
          echo "::endgroup::"

  tag:
    name: Tag
    needs:
      - unit
      - scan-gitleaks
      - scan-trivy
      - scan-zizmor
      - functional-compose
      - functional-tilt
    permissions:
      contents: write # for pushing tags (and checkout)
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.tag.outputs.short }}
      long: ${{ steps.tag.outputs.long }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Tag
        id: tag
        uses: ./.github/actions/tag
        with:
          rollover: true

  build:
    name: Build
    needs:
      - tag
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
      packages: write # for container push
      id-token: write # for keyless image signing
      security-events: write # for uploading code scanning results
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: GHCR Login
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Setup cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Get trivy version
        id: trivy-version
        run: |
          ./tools/bingo-version.sh trivy >> "$GITHUB_OUTPUT"

      - name: Build
        uses: ./.github/actions/container-build
        with:
          service: example-rpc
          repository: ghcr.io/mattdowdell/sandbox/example-rpc
          version: ${{ needs.tag.outputs.long }}
          trivy-version: ${{ steps.trivy-version.outputs.version }}
