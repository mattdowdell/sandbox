name: Regenerate

on:
  issue_comment:
    types:
      - created
      - edited

permissions: {}

jobs:
  regenerate:
    name: Regenerate
    permissions:
      pull-requests: write # for obtaining head ref + reaction acknowledgement
    runs-on: ubuntu-latest
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/regenerate') }}
    steps:
      - name: Acknowledge
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/issues/comments/${COMMENT_ID}/reactions \
            -f "content=+1"
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - name: PR branch
        id: ref
        run: |
          echo "ref=`gh pr view '${{ github.event.issue.number }}' \
            --repo ${{ github.repository }} \
            --template '{{ .headRefName }}' \
            --json headRefName`" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@3ff1caaa28b64c9cc276ce0a02e2ff584f3900c5 # v2.0.2
        with:
          app-id: ${{ secrets.REGENERATE_APP_ID }}
          private-key: ${{ secrets.REGENERATE_APP_PEM }}
          permission-contents: write

      - name: Get user ID
        id: user
        run: |
          echo "id=`gh api /users/${APP_SLUG}\[bot\] --jq '.id'`" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # re-used for commit/push

      - name: Setup checks
        uses: ./.github/actions/setup-checks

      - name: Start database
        uses: hoverkraft-tech/compose-action@8be2d741e891ac9b8ac20825e6f3904149599925 # v2.2.0
        with:
          compose-file: compose.yaml
          up-flags: --build --wait
          down-flags: --volumes --remove-orphans
          services: postgres

      - name: Regenerate
        run: |
          just checks

      - name: Commit diff
        run: |
          # make sure new files are included in the diff
          git add .

          if git diff HEAD --quiet -- .
          then
            echo "regenerate found no changes"
            exit 0
          fi

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git commit -m "Regenerate code"
          git push
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.user.outputs.id }}

      - name: Report failure
        # if: failure()
        run: |
          url=`gh run --repo ${{ github.repository }} view ${{ github.run_id }} --json jobs --jq '.jobs[].url'`

          gh pr comment '${{ github.event.issue.number }}' \
            --repo ${{ github.repository }} \
            --body 'Regenerate failed. See the [logs](${url}) for more info.'

