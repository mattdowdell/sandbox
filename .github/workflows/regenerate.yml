---
name: Regenerate

on:
  issue_comment:
    types:
      - created
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  regenerate:
    name: Regenerate
    permissions:
      pull-requests: write # for obtaining head ref + reaction acknowledgement
    runs-on: ubuntu-latest
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/regenerate') }}
    steps:
      - name: Debug env
        run: |
          env | sort

      - name: Acknowledge
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions \
            -f "content=+1"
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - name: PR branch
        id: ref
        run: |
          echo "ref=`gh pr view ${ISSUE_NUMBER} \
            --repo ${GITHUB_REPOSITORY} \
            --template '{{ .headRefName }}' \
            --json headRefName`" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94 # v2.2.0
        with:
          app-id: ${{ secrets.REGENERATE_APP_ID }}
          private-key: ${{ secrets.REGENERATE_APP_PEM }}
          permission-contents: write

      - name: Get user ID
        id: user
        run: |
          echo "id=`gh api /users/${APP_SLUG}\[bot\] --jq '.id'`" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # re-used for commit/push

      - name: Setup checks
        uses: ./.github/actions/setup-checks

      - name: Start database
        uses: hoverkraft-tech/compose-action@3846bcd61da338e9eaaf83e7ed0234a12b099b72 # v2.4.1
        with:
          compose-file: compose.yaml
          up-flags: --build --wait
          down-flags: --volumes --remove-orphans
          services: |
            postgres
            migrate

      - name: Regenerate
        run: |
          # look for tool updates first as it can cause other commands to fail
          just gen-tools
          just checks

      - name: Commit diff
        run: |
          # make sure new files are included in the diff
          git add .

          if git diff HEAD --quiet -- .
          then
            echo "regenerate found no changes"
            exit 0
          fi

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git commit -m "Regenerate code"
          git push
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.user.outputs.id }}

      - name: Report failure
        if: failure()
        run: |
          url=`gh run --repo ${GITHUB_REPOSITORY} view ${GITHUB_RUN_ID} --json jobs --jq '.jobs[].url'`

          gh pr comment ${ISSUE_NUMBER} \
            --repo ${GITHUB_REPOSITORY} \
            --body "Regenerate failed. See the [logs](${url}) for more info."
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

