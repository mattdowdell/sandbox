---
name: "Setup Checks"
description: Setup a runner for running 'just checks'.

runs:
  using: "composite"
  steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"

    - name: Install Buf
      uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
      with:
        setup_only: true

    - name: Install Just
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: just

    - name: Install bingo
      uses: mattdowdell/go-installer@de5d072ade9fc895652cd6a93ac4bde11e105bc6 # v0.4.0
      with:
        package: github.com/bwplotka/bingo
