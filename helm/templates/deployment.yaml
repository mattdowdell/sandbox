{{- range $name, $deployment := .Values.deployments }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "helper.labels" (dict "name" $name "context" $) | nindent 4 }}
spec:
  replicas: {{ .replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "helper.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helper.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ include "helper.serviceAccountName" $ }}
      containers:
        {{- range $name, $container := .containers }}
        - name: {{ $name }}
          image: {{ .image.repository }}:{{ .image.tag | default $.Chart.AppVersion }}
          imagePullPolicy: {{ .image.pullPolicy | default "Always" }}
          command: ["/{{ $name }}"]
          securityContext: {{- toYaml $.Values.securityContext | nindent 12 }}
          {{- if .env }}
          env:
            {{- range $name, $value := .env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end}}
          {{- end }}
          {{- if or $deployment.configmaps $deployment.secrets }}
          volumeMounts:
            {{- range $deployment.configmaps }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
            {{- range $deployment.secrets }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
        {{- end }}
      {{- if or $deployment.configmaps $deployment.secrets }}
      volumes:
        {{- range .configmaps }}
        - name: {{ .name }}
          configMap:
            name: {{ .name }}
        {{- end }}
        {{- range .secrets }}
        - name: {{ .name }}
          secret:
            secretName: {{ .name }}
            {{- if .items }}
            items:
              {{- range .items }}
              - key: {{ .key }}
                {{- if .path }}
                path: {{ .path }}
                {{- end }}
              {{- end }}
            {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
