{{- range $name, $deployment := .Values.deployments }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: {{ $name }}
    # TODO: instance
    app.kubernetes.io/version: {{ $.Chart.AppVersion }}
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  replicas: {{ .replicas | default 2 }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/version: {{ $.Chart.AppVersion }}
        app.kubernetes.io/part-of: {{ $.Chart.Name }}
    spec:
      containers:
        {{- range $name, $container := .containers }}
        - name: {{ $name }}
          image: {{ .image.repository }}:{{ .image.tag | default $.Chart.AppVersion }}
          imagePullPolicy: {{ .image.pullPolicy | default "Always" }}
          command: ["/{{ .name }}"]
          securityContext: {{- toYaml $.Values.securityContext | nindent 12 }}
          serviceAccountName: {{ include "helper."}}
          {{- if .env }}
          env:
            {{- range $name, $value := .env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end}}
          {{- end }}
          {{- if or $deployment.configmaps $deployment.secrets }}
          volumeMounts:
            {{- range $deployment.configmaps }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
            {{- range $deployment.secrets }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
        {{- end }}
      {{- if or $deployment.configmaps $deployment.secrets }}
      volumes:
        {{- range .configmaps }}
        - name: {{ .name }}
          configMap:
            name: {{ .name }}
        {{- end }}
        {{- range .secrets }}
        - name: {{ .name }}
          secret:
            secretName: {{ .name }}
            {{- if .items }}
            items:
              {{- range .items }}
              - key: {{ .key }}
                {{- if .path }}
                path: {{ .path }}
                {{- end }}
              {{- end }}
            {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
