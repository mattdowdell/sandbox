---
# https://docs.docker.com/reference/compose-file/

services:
  rpc:
    image: "ghcr.io/mattdowdell/sandbox/example-rpc:local"
    build:
      context: .
      target: runtime
      args:
        SERVICE: example-rpc
        GO_BUILD_ARGS: ${GO_BUILD_ARGS:-}
    entrypoint: ["/example-rpc"]
    environment:
      GOCOVERDIR: "/covdata"
      APP_AUTHN_ADDRESS: "http://localhost:5000"
      APP_DATABASE_HOSTNAME: "postgres"
      APP_DATABASE_USERNAME: "postgres"
      APP_DATABASE_PASSWORD: "secret"
      APP_DATABASE_NAME: "postgres"
      APP_DATABASE_SSLMODE: "disable"
      APP_ISSUER_AUDIENCE: "example"
      APP_ISSUER_ISSUER: "example"
      APP_LOGGING_LEVEL: "debug"
      APP_PARSER_AUDIENCE: "example"
      APP_PARSER_ISSUER: "example"
      APP_PARSER_METHODS: "HS256"
      APP_RPCSERVER_HOST: "0.0.0.0"
      APP_RPCSERVER_ENABLEPPROF: "true"
      APP_METERPROVIDER_INSECURE: "true"
      APP_METERPROVIDER_ENDPOINT: "victoria-metrics:8428"
      APP_METERPROVIDER_PATH: "/opentelemetry/v1/metrics"
      APP_TRACERPROVIDER_INSECURE: "true"
      APP_TRACERPROVIDER_ENDPOINT: "jaeger:4318"
      APP_LOGGERPROVIDER_INSECURE: "true"
      APP_LOGGERPROVIDER_ENDPOINT: "victoria-logs:9428"
      APP_LOGGERPROVIDER_PATH: "/insert/opentelemetry/v1/logs"
      OTEL_SEMCONV_STABILITY_OPT_IN: "database"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - "./.covdata:/covdata"
    healthcheck:
      test: ["CMD", "/example-health"]
      start_period: "30s"
      start_interval: "1s"
    depends_on:
      jaeger:
        condition: service_healthy
      victoria-metrics:
        condition: service_healthy
      victoria-logs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always

  migrate:
    image: "ghcr.io/mattdowdell/sandbox/example-db-migrate:local"
    build:
      context: .
      target: runtime
      args:
        SERVICE: example-db-migrate
        GO_BUILD_ARGS: ${GO_BUILD_ARGS:-}
    entrypoint: ["/example-db-migrate"]
    environment:
      GOCOVERDIR: "/covdata"
      APP_DATABASE_HOSTNAME: "postgres"
      APP_DATABASE_USERNAME: "postgres"
      APP_DATABASE_PASSWORD: "secret"
      APP_DATABASE_NAME: "postgres"
      APP_DATABASE_SSLMODE: "disable"
      APP_LOGGING_LEVEL: "debug"
      APP_METERPROVIDER_INSECURE: "true"
      APP_METERPROVIDER_ENDPOINT: "victoria-metrics:8428"
      APP_METERPROVIDER_PATH: "/opentelemetry/v1/metrics"
      APP_TRACERPROVIDER_INSECURE: "true"
      APP_TRACERPROVIDER_ENDPOINT: "jaeger:4318"
      APP_LOGGERPROVIDER_INSECURE: "true"
      APP_LOGGERPROVIDER_ENDPOINT: "victoria-logs:9428"
      APP_LOGGERPROVIDER_PATH: "/insert/opentelemetry/v1/logs"
    volumes:
      - "./.covdata:/covdata"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: "mirror.gcr.io/postgres:18"
    pull_policy: "always"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "secret"
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      start_period: "30s"
      start_interval: "1s"
    restart: always

  jaeger:
    image: "mirror.gcr.io/jaegertracing/jaeger:2.11.0"
    pull_policy: "always"
    ports:
      - "127.0.0.1:16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:16686/"]
      start_period: "30s"
      start_interval: "1s"
    restart: always

  victoria-metrics:
    image: "mirror.gcr.io/victoriametrics/victoria-metrics:v1.129.1"
    pull_policy: "always"
    ports:
      - "127.0.0.1:8428:8428"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/-/healthy"]
      start_period: "30s"
      start_interval: "1s"
    restart: always

  victoria-logs:
    image: "mirror.gcr.io/victoriametrics/victoria-logs:v1.24.0-victorialogs"
    pull_policy: "always"
    ports:
      - "127.0.0.1:9428:9428"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9428/-/healthy"]
      start_period: "30s"
      start_interval: "1s"
    restart: always

  grafana:
    image: "mirror.gcr.io/grafana/grafana:12.2.1"
    pull_policy: "always"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_BASIC_ENABLED: "false"
      # while victoriametrics is somewhat compatible with prometheus, it differs just enough that
      # some parts are broken, see https://github.com/grafana/grafana/issues/42615
      GF_INSTALL_PLUGINS: "victoriametrics-metrics-datasource,victoriametrics-logs-datasource"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - "./config/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"
      - "./config/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro"
      - "./config/dashboards:/etc/dashboards:rw"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      start_period: "30s"
      start_interval: "1s"
    restart: always


